name: Deploy

on:
  push:
    branches:
      - main
      - phase-1/foundation

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "wrangler_env_flag=--env production" >> "$GITHUB_OUTPUT"
          else
            echo "wrangler_env_flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run database migrations
        working-directory: packages/db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:migrate

      - name: Seed database (roles, permissions, Super Admin)
        working-directory: packages/db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # Idempotent: seedRoles/seedPermissions upsert, seedSuperAdmin skips if
        # the Super Admin user already exists. Safe to run on every deploy.
        run: pnpm db:seed

      # `pnpm dlx`, not `npx`: npx resolving a caret-range spec (`wrangler@^4`)
      # inside this pnpm-managed workspace was failing instantly with
      # "sh: 1: wrangler: not found" (exit 127) - a known class of npm/pnpm
      # cache-interaction issue. pnpm dlx is the pnpm-native equivalent and
      # doesn't hit it.
      - name: Deploy
        working-directory: apps/api
        run: pnpm dlx wrangler@^4 deploy ${{ steps.env.outputs.wrangler_env_flag }}

      # Runs after Deploy, not before: Cloudflare changed `secret put` (v3.78.5+,
      # carried into v4) to require the worker's latest version already be
      # deployed before secrets can be modified - "Secret edit failed... the
      # latest version of your Worker isn't currently deployed" otherwise. This
      # order worked under our previous wrangler@^3 pin; the v4 bump surfaced
      # this requirement. A brief window where the freshly-deployed code runs
      # against whatever secrets were already set from the prior deploy is
      # harmless for Phase 1 (no real business data yet).
      - name: Set Workers secrets
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
          JWT_REFRESH_KEY: ${{ secrets.JWT_REFRESH_KEY }}
        run: |
          echo "$DATABASE_URL" | pnpm dlx wrangler@^4 secret put DATABASE_URL ${{ steps.env.outputs.wrangler_env_flag }}
          echo "$JWT_SIGNING_KEY" | pnpm dlx wrangler@^4 secret put JWT_SIGNING_KEY ${{ steps.env.outputs.wrangler_env_flag }}
          echo "$JWT_REFRESH_KEY" | pnpm dlx wrangler@^4 secret put JWT_REFRESH_KEY ${{ steps.env.outputs.wrangler_env_flag }}

  deploy-web:
    name: Deploy Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "wrangler_env_flag=--env production" >> "$GITHUB_OUTPUT"
          else
            echo "wrangler_env_flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        working-directory: apps/web
        run: pnpm run cf:build

      # pnpm dlx, not npx - see matching comment in deploy-api's Deploy step.
      - name: Deploy
        working-directory: apps/web
        run: pnpm dlx wrangler@^4 deploy ${{ steps.env.outputs.wrangler_env_flag }}
