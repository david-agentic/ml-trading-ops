# Top-level name is the preview deploy target (pushes to phase-1/foundation).
# `wrangler deploy --env production` (main branch only) deploys as the real name.
name = "ml-trading-ops-api-preview"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[observability]
enabled = true

# TODO: replace with the real KV namespace id (owner creates it once via the
# Cloudflare dashboard: Workers & Pages -> KV -> Create namespace). Same namespace
# used for both preview and production — Phase 1 has no real business data yet, so
# a single shared rate-limit store is fine (see phase-01-plan.md).
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "REPLACE_WITH_REAL_KV_NAMESPACE_ID"

[env.production]
name = "ml-trading-ops-api"

[[env.production.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "REPLACE_WITH_REAL_KV_NAMESPACE_ID"
